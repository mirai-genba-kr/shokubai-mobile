<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="シリカチャージ">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<title>シリカチャージ記録</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#16202B}
  #wrap{display:flex;flex-direction:column;height:100%}
  iframe{flex:1 1 auto;width:100%;border:0;display:block;background:#fff}

  /* ホーム画面に追加してもらうための案内（追加済みなら出さない） */
  #install{
    flex:0 0 auto;display:none;background:#1B5691;color:#fff;padding:11px 13px;
    font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;font-size:12.5px;line-height:1.6
  }
  #install.on{display:block}
  #install b{font-size:13.5px}
  #install .x{
    float:right;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:6px;
    width:26px;height:26px;font-size:15px;line-height:1;margin-left:8px
  }
  #install .step{display:inline-block;background:rgba(255,255,255,.18);border-radius:4px;padding:1px 6px;margin:0 2px}

  #loading{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:#16202B;color:#94A7B8;
    font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;font-size:13px;z-index:5
  }
  #loading .sp{width:28px;height:28px;border:3px solid #2A3844;border-top-color:#33B183;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading"><div class="sp"></div>読み込んでいます…</div>

<div id="wrap">
  <div id="install">
    <button class="x" id="installClose" aria-label="閉じる">×</button>
    <b>ホーム画面に追加してください</b><br>
    下の <span class="step">共有 ↑</span> → <span class="step">ホーム画面に追加</span> の順にタップ。<br>
    次回からアイコンだけで開けて、<b>端末登録もやり直しになりません</b>。
  </div>

  <iframe
    id="app"
    title="シリカチャージ記録"
    allow="camera; clipboard-write"
    src="https://script.google.com/macros/s/AKfycbx5_xnfKKTb_0cG0itesSHWfjPJF_6aU9irLvL17EUKfHEqGnhZYIQmOciVue_It4oc/exec"></iframe>
</div>

<script>
/**
 * 端末の「登録済み」状態は、このページ側で預かる。
 *
 * 中のアプリ（GAS）は別ドメインなので、iPhoneのSafariが
 * その保存領域を消してしまう。利用者が直接開いているこちらなら消えない。
 * 中のアプリから「くれ」と言われたら渡し、「持っておいて」と言われたら保存する。
 */
(function(){
  'use strict';

  // GASのユーザーコードは *.googleusercontent.com で動く
  var ALLOW_ORIGIN = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/;
  var KEYS = { device:'shokubai_deviceId', token:'shokubai_refreshToken', dismissed:'shokubai_installDismissed' };

  function read(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
  function write(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
  function drop(k){ try { window.localStorage.removeItem(k); } catch(e){} }

  window.addEventListener('message', function(e){
    if (!ALLOW_ORIGIN.test(e.origin)) return;
    var m = e.data;
    if (!m || typeof m !== 'object') return;

    if (m.type === 'AUTH_GET') {
      if (!e.source) return;
      e.source.postMessage({
        type:         'AUTH_VALUE',
        deviceId:     read(KEYS.device),
        refreshToken: read(KEYS.token)
      }, e.origin);

    } else if (m.type === 'AUTH_SET') {
      if (m.deviceId)     write(KEYS.device, m.deviceId);
      if (m.refreshToken) write(KEYS.token,  m.refreshToken);

    } else if (m.type === 'AUTH_CLEAR') {
      drop(KEYS.token);
    }
  });

  /* ホーム画面から起動していない場合だけ案内を出す。
     QRから開いたアプリ内ブラウザは保存が残らないため、追加してもらう必要がある。 */
  var standalone = (window.navigator.standalone === true) ||
                   (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  if (!standalone && !read(KEYS.dismissed)) {
    document.getElementById('install').classList.add('on');
  }
  document.getElementById('installClose').addEventListener('click', function(){
    write(KEYS.dismissed, '1');
    document.getElementById('install').classList.remove('on');
  });

  document.getElementById('app').addEventListener('load', function(){
    var el = document.getElementById('loading');
    if (el) el.style.display = 'none';
  });
})();
</script>
</body>
</html>
